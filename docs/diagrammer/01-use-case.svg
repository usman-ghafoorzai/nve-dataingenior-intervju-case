<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc">
<title id="title">Use Case</title><desc id="desc">Kildeapplikasjonen overfører treningsdata til strukturert lagring. Konsumenten henter relevant klinisk kontekst. Det simulerte EPJ-miljøet deltar som støttesystem for begge handlinger.</desc>
