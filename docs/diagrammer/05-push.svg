<text x="145.0" y="194" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Kilde</text>
<text x="145.0" y="221" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Treningsdata</text>
<text x="145.0" y="246" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Pasienttilknytning</text>
<rect x="330" y="165" width="220" height="99" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="440.0" y="194" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">API / service</text>
<text x="440.0" y="221" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Validerer input</text>
<text x="440.0" y="246" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Koordinerer</text>
<rect x="625" y="165" width="220" height="99" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="735.0" y="194" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Mapper</text>
<text x="735.0" y="221" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Input → FHIR</text>
<rect x="930" y="165" width="230" height="99" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="1045.0" y="194" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Adapter / klient</text>
<text x="1045.0" y="221" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Sender FHIR</text>
