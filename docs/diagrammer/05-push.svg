<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-labelledby="title desc">
<title id="title">Push – implementert flyt</title><desc id="desc">Origo dashboard sender Game session data til PushController, PushService, GameSessionObservationMapper og HapiFhirClient. HAPI FHIR lagrer Observation og bruker Subscription callback til CustomController. ResourceRoutingService ruter til GameSessionResultObservationHandler, GameSessionResultObservationMapper og GameSessionResultCompositionBuilder. EhrbaseHelper lagrer openEHR composition i EHRbase.</desc>
