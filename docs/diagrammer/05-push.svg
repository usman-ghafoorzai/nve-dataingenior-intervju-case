<rect x="20" y="720" width="1160" height="145" rx="3" fill="#f3f7fb" stroke="#87919c" stroke-width="1.2"/>
<text x="38" y="749" font-size="20" fill="#172b44" font-weight="700" text-anchor="start">EHRbase</text>
<rect x="40" y="765" width="300" height="80" rx="3" fill="#e5f3e5" stroke="#87919c" stroke-width="1.2"/>
<text x="190.0" y="794" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Lagrer composition</text>
<text x="190.0" y="821" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Persistens i PostgreSQL</text>
<polyline points="155,639 155,765" fill="none" stroke="#a54b13" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#push)"/>
<text x="173" y="695" font-size="17" fill="#a54b13" font-weight="400" text-anchor="start">openEHR</text>
<text x="410" y="792" font-size="18" fill="#526477" font-weight="400" text-anchor="start">Forutsetning: syntetisk pasient er opprettet før innsending.</text>
<text x="410" y="822" font-size="18" fill="#526477" font-weight="400" text-anchor="start">HAPI FHIR lagrer også sine ressurser i PostgreSQL.</text>
<rect x="20" y="920" width="1160" height="85" rx="3" fill="#f2f3f5" stroke="#87919c" stroke-width="1.2" stroke-dasharray="8 6"/>
<text x="40" y="950" font-size="19" fill="#172b44" font-weight="700" text-anchor="start">VERIFIKASJON · separat kontrollaktivitet</text>
<text x="40" y="980" font-size="18" fill="#526477" font-weight="400" text-anchor="start">Kontroller FHIR-resultatet og lagret openEHR-innhold. API-kvittering er ikke bevis på fullført kjede.</text>
<polyline points="190,845 190,920" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)" stroke-dasharray="6 5"/>
