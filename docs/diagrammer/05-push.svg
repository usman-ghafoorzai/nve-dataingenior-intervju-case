<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">Push – implementert flyt</title><desc id="desc">Kilden sender treningsdata. Klienten validerer og mapper til FHIR før innsending til HAPI FHIR. HAPI FHIR lagrer; konfigurert Subscription videresender relevante ressurser. Bridge-laget mottar, fordeler, mapper og bygger openEHR mot template-struktur, finner eller oppretter EHR og lagrer gjennom EHRbase. Sluttresultatet verifiseres separat.</desc>
<defs>
<marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker>
<marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54b13"/></marker>
<marker id="pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08776f"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<rect width="1200" height="1030" rx="0" fill="#ffffff"/>
<text x="30" y="37" font-size="30" fill="#111111" font-weight="700" text-anchor="start">Push – implementert flyt</text>
<text x="30" y="66" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Treningsdata inn · les fra øverst mot nederst</text>
