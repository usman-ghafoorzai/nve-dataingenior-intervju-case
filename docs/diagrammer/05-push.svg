<text x="450.0" y="596" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">openEHR / template</text>
<rect x="40" y="540" width="230" height="99" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="155.0" y="569" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Repository-klient</text>
<text x="155.0" y="596" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Finn / opprett EHR</text>
<polyline points="1045,425 1045,540" fill="none" stroke="#a54b13" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#push)"/>
