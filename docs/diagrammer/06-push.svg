<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="444" viewBox="0 0 1040 444" role="img" aria-labelledby="title desc">
<title id="title">Push: nye treningsdata inn</title><desc id="desc">Syntetiske treningsdata går fra kilde via inputvalidering og FHIR-representasjon til Subscription, mapping til openEHR, lagring og kontroll av faktisk resultat.</desc>
<defs>
<marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker>
<marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54b13"/></marker>
<marker id="pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08776f"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<rect width="1040" height="444" rx="16" fill="#ffffff"/>
<text x="30" y="37" font-size="25" fill="#172b44" font-weight="700" text-anchor="start">Push: nye treningsdata inn</text>
<text x="30" y="66" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Initiert av kilden · les øvre rad mot høyre, deretter ned og tilbake</text>
<rect x="30" y="105" width="270" height="105" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="47" y="134" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">1. Kilden sender</text>
<text x="47" y="161" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Syntetiske øktdata</text>
<text x="47" y="184" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Knyttet til pasient</text>
<rect x="385" y="105" width="270" height="105" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="402" y="134" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">2. Integrasjonsgrense</text>
<text x="402" y="161" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Validerer input</text>
<text x="402" y="184" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Kildeformat → FHIR</text>
<rect x="740" y="105" width="270" height="105" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="757" y="134" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">3. FHIR-server</text>
<text x="757" y="161" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Lagrer ressurs</text>
<text x="757" y="184" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Subscription videresender</text>
<rect x="740" y="282" width="270" height="105" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="757" y="311" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">4. Mapping</text>
<text x="757" y="338" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Semantisk transformasjon</text>
<text x="757" y="361" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">FHIR → openEHR</text>
<rect x="385" y="282" width="270" height="105" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="402" y="311" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">5. Klinisk repository</text>
<text x="402" y="338" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Strukturert composition</text>
<text x="402" y="361" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Persistent lagring</text>
<rect x="30" y="282" width="270" height="105" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="47" y="311" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">6. Kontroll av resultat</text>
<text x="47" y="338" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">FHIR-representasjon</text>
<text x="47" y="361" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Faktisk openEHR-innhold</text>
