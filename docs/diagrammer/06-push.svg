<polyline points="385,334 300,334" fill="none" stroke="#a54b13" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#push)"/>
<text x="30" y="427" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Kvittering ved innsending og kontroll av ferdig lagring er ulike verifikasjonspunkter.</text>
</g></svg>
