<text x="135.0" y="626" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Data / tom respons</text>
<rect x="340" y="570" width="210" height="90" rx="3" fill="#e7f4e9" stroke="#87919c" stroke-width="1.2"/>
<text x="445.0" y="599" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Integrasjonsklient</text>
<text x="445.0" y="626" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Validerer / mapper</text>
<rect x="650" y="570" width="210" height="90" rx="3" fill="#e7f4e9" stroke="#87919c" stroke-width="1.2"/>
<text x="755.0" y="599" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Bridge / uthenting</text>
<text x="755.0" y="626" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">AQL / mapping</text>
<rect x="950" y="570" width="210" height="90" rx="3" fill="#e7f4e9" stroke="#87919c" stroke-width="1.2"/>
<text x="1055.0" y="599" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">EHRbase</text>
<text x="1055.0" y="626" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">openEHR-kontekst</text>
<polyline points="240,588 340,588" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)" stroke-dasharray="6 5"/>
<polyline points="340,642 240,642" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<polyline points="550,588 650,588" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)" stroke-dasharray="6 5"/>
<polyline points="650,642 550,642" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<polyline points="860,588 950,588" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)" stroke-dasharray="6 5"/>
<polyline points="950,642 860,642" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<text x="600" y="550" font-size="17" fill="#08776f" font-weight="400" text-anchor="middle">Separat forespørselsstyrt uthentingsvei</text>
<text x="285" y="688" font-size="16" fill="#08776f" font-weight="400" text-anchor="middle">Konsumentformat</text>
<text x="600" y="688" font-size="16" fill="#08776f" font-weight="400" text-anchor="middle">FHIR</text>
<text x="905" y="688" font-size="16" fill="#08776f" font-weight="400" text-anchor="middle">openEHR</text>
<text x="30" y="749" font-size="18" fill="#526477" font-weight="400" text-anchor="start">Stiplet grønn: forespørsel. Heltrukket grønn: respons. HAPI FHIR inngår ikke i implementert pull.</text>
<text x="30" y="776" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Komponentene er vist på nytt for pull. Persistensen er den samme som i øvre del.</text>
</g></svg>
