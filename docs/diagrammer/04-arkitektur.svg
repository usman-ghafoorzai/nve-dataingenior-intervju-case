<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc">
<title id="title">Teknisk arkitektur</title><desc id="desc">Fire logiske lag: applikasjon, integrasjon, semantisk mapping og klinisk datalag. Push bruker FHIR-server og Subscription. Pull bruker en separat forespørselsstyrt uthentingsvei. EHRbase og HAPI FHIR bruker PostgreSQL til persistens.</desc>
