<text x="135.0" y="214" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Kilde</text>
<text x="135.0" y="241" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Treningsdata</text>
<rect x="260" y="185" width="210" height="90" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="365.0" y="214" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Integrasjonsklient</text>
<text x="365.0" y="241" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Validerer / mapper</text>
<rect x="490" y="185" width="210" height="90" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="595.0" y="214" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">HAPI FHIR</text>
<text x="595.0" y="241" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Lagrer FHIR</text>
<rect x="720" y="185" width="210" height="90" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="825.0" y="214" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Bridge / mapping</text>
<text x="825.0" y="241" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">FHIR → openEHR</text>
<rect x="950" y="185" width="210" height="90" rx="3" fill="#fff0df" stroke="#87919c" stroke-width="1.2"/>
<text x="1055.0" y="214" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">EHRbase</text>
<text x="1055.0" y="241" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">openEHR repository</text>
