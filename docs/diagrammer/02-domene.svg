<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Domenemodell</title><desc id="desc">En pasient gjennomfører treningsøkter som gir treningsdata. Klinisk kontekst gjelder samme pasient, men er et annet datasett.</desc>
<defs>
<marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker>
<marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54b13"/></marker>
<marker id="pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08776f"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<rect width="1200" height="350" rx="0" fill="#ffffff"/>
<text x="30" y="37" font-size="30" fill="#111111" font-weight="700" text-anchor="start">Domenemodell</text>
<text x="30" y="66" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Hva betyr dataene?</text>
<rect x="40" y="115" width="240" height="80" rx="3" fill="#dcecff" stroke="#87919c" stroke-width="1.2"/>
<text x="160.0" y="162.0" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Pasient</text>
<rect x="455" y="115" width="250" height="80" rx="3" fill="#fff2bf" stroke="#87919c" stroke-width="1.2"/>
<text x="580.0" y="162.0" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Treningsøkt</text>
<rect x="900" y="115" width="260" height="80" rx="3" fill="#f6dde2" stroke="#87919c" stroke-width="1.2"/>
<text x="1030.0" y="162.0" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Treningsdata</text>
<rect x="40" y="260" width="240" height="65" rx="3" fill="#eaddf4" stroke="#87919c" stroke-width="1.2"/>
<text x="160.0" y="299.5" font-size="20" fill="#172b44" font-weight="700" text-anchor="middle">Klinisk kontekst</text>
<polyline points="280,155 455,155" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)"/>
<text x="367" y="140" font-size="17" fill="#526477" font-weight="400" text-anchor="middle">gjennomfører</text>
<polyline points="705,155 900,155" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)"/>
<text x="802" y="140" font-size="17" fill="#526477" font-weight="400" text-anchor="middle">gir</text>
<polyline points="160,260 160,195" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)"/>
<text x="178" y="232" font-size="17" fill="#526477" font-weight="400" text-anchor="start">gjelder</text>
<text x="455" y="289" font-size="20" fill="#172b44" font-weight="700" text-anchor="start">Push: treningsdata. Pull: legemiddelkontekst.</text>
<text x="455" y="319" font-size="18" fill="#526477" font-weight="400" text-anchor="start">Ulike datasett knyttet til en pasient i testscenarioet.</text>
</g></svg>
