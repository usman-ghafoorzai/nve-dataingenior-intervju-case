<text x="47" y="142" font-size="19" fill="#2159a5" font-weight="700" text-anchor="start">Pasient</text>
<text x="47" y="169" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Syntetisk identitet</text>
<rect x="330" y="113" width="240" height="90" rx="12" fill="#eff5fd" stroke="#2159a5" stroke-width="1.4"/>
<text x="347" y="142" font-size="19" fill="#2159a5" font-weight="700" text-anchor="start">Treningsøkt</text>
<text x="347" y="169" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Én pasient per økt</text>
<rect x="710" y="113" width="300" height="90" rx="12" fill="#eff5fd" stroke="#2159a5" stroke-width="1.4"/>
<text x="727" y="142" font-size="19" fill="#2159a5" font-weight="700" text-anchor="start">Treningsdata</text>
<text x="727" y="169" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Resultater fra økten</text>
