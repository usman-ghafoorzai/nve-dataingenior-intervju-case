<text x="640" y="137" font-size="16" fill="#526477" font-weight="400" text-anchor="middle">gir</text>
<polyline points="125,288 125,203" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)"/>
<text x="140" y="250" font-size="16" fill="#526477" font-weight="400" text-anchor="start">gjelder</text>
