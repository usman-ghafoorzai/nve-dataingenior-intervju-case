<text x="47" y="317" font-size="19" fill="#2159a5" font-weight="700" text-anchor="start">Klinisk kontekst</text>
<text x="47" y="344" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Legemiddelinformasjon</text>
<rect x="385" y="288" width="265" height="90" rx="12" fill="#eff5fd" stroke="#2159a5" stroke-width="1.4"/>
<text x="402" y="317" font-size="19" fill="#2159a5" font-weight="700" text-anchor="start">Simulert EPJ-miljø</text>
<text x="402" y="344" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Inneholder konteksten</text>
<rect x="760" y="288" width="250" height="90" rx="12" fill="#eff5fd" stroke="#2159a5" stroke-width="1.4"/>
<text x="777" y="317" font-size="19" fill="#2159a5" font-weight="700" text-anchor="start">Kildeapplikasjon</text>
