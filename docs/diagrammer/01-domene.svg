<text x="705" y="309" font-size="16" fill="#526477" font-weight="400" text-anchor="middle">ber om</text>
<text x="705" y="329" font-size="16" fill="#526477" font-weight="400" text-anchor="middle">kontekst</text>
<text x="30" y="413" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Helsepersonell er tiltenkt bruker av informasjonen; klinisk bruk ble ikke evaluert.</text>
