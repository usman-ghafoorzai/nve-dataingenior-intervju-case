<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="435" viewBox="0 0 1040 435" role="img" aria-labelledby="title desc">
<title id="title">Domene og data</title><desc id="desc">En pasient gjennomfører økter som gir treningsdata. Kildeapplikasjonen produserer treningsdata og ber om klinisk kontekst. EPJ-miljøet inneholder konteksten. Helsepersonell er tiltenkt bruker.</desc>
<defs>
<marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker>
<marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54b13"/></marker>
<marker id="pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08776f"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<rect width="1040" height="435" rx="16" fill="#ffffff"/>
<text x="30" y="37" font-size="25" fill="#172b44" font-weight="700" text-anchor="start">Domene og data</text>
<text x="30" y="66" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Begrepsmodell · syntetiske scenarioer · ingen database- eller API-modell</text>
