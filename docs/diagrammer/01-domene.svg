<polyline points="220,153 330,153" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)"/>
<text x="275" y="137" font-size="16" fill="#526477" font-weight="400" text-anchor="middle">har økter</text>
