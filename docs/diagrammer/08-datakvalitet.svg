<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="395" viewBox="0 0 1040 395" role="img" aria-labelledby="title desc">
<title id="title">Kvalitet gjennom begge flytene</title><desc id="desc">Begge flytene har inputvalidering og transformasjonstester. Push-verifikasjon omfatter FHIR-resultat og separat kontroll av openEHR-persistens. Pull-verifikasjon omfatter AQL-uthenting, tidsfiltrering og respons med data eller tom liste.</desc>
<defs>
<marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker>
<marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54b13"/></marker>
<marker id="pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08776f"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<rect width="1040" height="395" rx="16" fill="#ffffff"/>
<text x="30" y="37" font-size="25" fill="#172b44" font-weight="700" text-anchor="start">Kvalitet gjennom begge flytene</text>
<text x="30" y="66" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Dokumenterte kontrollnivåer · struktur, modellskifte og faktisk resultat</text>
<text x="30" y="108" font-size="16" fill="#526477" font-weight="700" text-anchor="start">VALIDER</text>
<text x="285" y="108" font-size="16" fill="#526477" font-weight="700" text-anchor="start">TRANSFORMER</text>
<text x="540" y="108" font-size="16" fill="#526477" font-weight="700" text-anchor="start">LAGRE / HENT</text>
<text x="795" y="108" font-size="16" fill="#526477" font-weight="700" text-anchor="start">VERIFISER</text>
<rect x="30" y="124" width="225" height="100" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="47" y="153" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">Push · input</text>
<text x="47" y="180" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">DTO-struktur</text>
<text x="47" y="203" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">API-grense</text>
<polyline points="255,174 285,174" fill="none" stroke="#a54b13" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#push)"/>
<rect x="285" y="124" width="225" height="100" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="302" y="153" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">Mapping</text>
<text x="302" y="180" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Kilde → FHIR</text>
<text x="302" y="203" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">FHIR → openEHR</text>
<polyline points="510,174 540,174" fill="none" stroke="#a54b13" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#push)"/>
<rect x="540" y="124" width="225" height="100" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
<text x="557" y="153" font-size="19" fill="#a54b13" font-weight="700" text-anchor="start">Persistens</text>
