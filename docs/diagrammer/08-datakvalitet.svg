<polyline points="255,294 285,294" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<rect x="285" y="244" width="225" height="100" rx="12" fill="#edf9f6" stroke="#08776f" stroke-width="1.4"/>
<text x="302" y="273" font-size="19" fill="#08776f" font-weight="700" text-anchor="start">Mapping / parsing</text>
<text x="302" y="300" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">openEHR → FHIR</text>
<text x="302" y="323" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">→ konsumentformat</text>
<polyline points="510,294 540,294" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<rect x="540" y="244" width="225" height="100" rx="12" fill="#edf9f6" stroke="#08776f" stroke-width="1.4"/>
<text x="557" y="273" font-size="19" fill="#08776f" font-weight="700" text-anchor="start">Uthenting</text>
<text x="557" y="300" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">AQL-verifikasjon</text>
<text x="557" y="323" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Tidsfiltrering</text>
<polyline points="765,294 795,294" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<rect x="795" y="244" width="225" height="100" rx="12" fill="#edf9f6" stroke="#08776f" stroke-width="1.4"/>
<text x="812" y="273" font-size="19" fill="#08776f" font-weight="700" text-anchor="start">Sluttresultat</text>
<text x="812" y="300" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Utvalgt kontekst</text>
<text x="812" y="323" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">eller tom liste</text>
<text x="30" y="377" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Unit tests og API-tester + lokal E2E og manuell kontroll. Full-stack E2E var utenfor standard CI.</text>
</g></svg>
