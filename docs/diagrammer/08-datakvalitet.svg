<text x="557" y="203" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">EHRbase-inspeksjon</text>
<polyline points="765,174 795,174" fill="none" stroke="#a54b13" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#push)"/>
<rect x="795" y="124" width="225" height="100" rx="12" fill="#fff4eb" stroke="#a54b13" stroke-width="1.4"/>
