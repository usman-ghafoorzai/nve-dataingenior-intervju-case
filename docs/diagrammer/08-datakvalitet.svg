<text x="812" y="180" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">Forventet struktur</text>
<text x="812" y="203" font-size="17" fill="#172b44" font-weight="400" text-anchor="start">i lagrede data</text>
<rect x="30" y="244" width="225" height="100" rx="12" fill="#edf9f6" stroke="#08776f" stroke-width="1.4"/>
