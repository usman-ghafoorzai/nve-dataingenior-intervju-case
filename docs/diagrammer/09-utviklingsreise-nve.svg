<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Min utviklingsreise i NVE</title><desc id="desc">Utgangspunkt: software- og integrasjonsbakgrunn. Første tid: lære domene, team og dataplattform gjennom avgrensede leveranser. Etter to til tre år: selvstendig ansvar for større deler av dataprodukter med kvalitet og drift.</desc>
<defs>
<marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526477"/></marker>
<marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a54b13"/></marker>
<marker id="pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08776f"/></marker>
</defs><g font-family="Arial, Helvetica, sans-serif">
<rect width="1200" height="420" rx="0" fill="#ffffff"/>
<text x="30" y="37" font-size="30" fill="#111111" font-weight="700" text-anchor="start">Min utviklingsreise i NVE</text>
<text x="30" y="66" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Fra software og integrasjon til ansvar for større deler av dataprodukter</text>
<rect x="30" y="135" width="300" height="185" rx="3" fill="#eaf3ff" stroke="#87919c" stroke-width="1.2"/>
<text x="180" y="175" font-size="21" fill="#172b44" font-weight="700" text-anchor="middle">UTGANGSPUNKT</text>
<text x="180" y="223" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Software / integrasjon</text>
<text x="180" y="248" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">API-er, databaser og testing</text>
<text x="180" y="273" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Erfaring fra lokal PoC</text>
<rect x="450" y="135" width="300" height="185" rx="3" fill="#f0eafa" stroke="#87919c" stroke-width="1.2"/>
<text x="600" y="175" font-size="21" fill="#172b44" font-weight="700" text-anchor="middle">FØRSTE TID I NVE</text>
<text x="600" y="223" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Domene, brukere og team</text>
<text x="600" y="248" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Lære plattformen i praksis</text>
<text x="600" y="273" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Avgrensede leveranser</text>
<rect x="870" y="135" width="300" height="185" rx="3" fill="#e7f4e9" stroke="#87919c" stroke-width="1.2"/>
<text x="1020" y="175" font-size="21" fill="#172b44" font-weight="700" text-anchor="middle">ETTER 2–3 ÅR</text>
<text x="1020" y="223" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Selvstendig dataingeniør</text>
<text x="1020" y="248" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Større deler av dataprodukter</text>
<text x="1020" y="273" font-size="18" fill="#172b44" font-weight="400" text-anchor="middle">Kvalitet, vedlikehold og drift</text>
<polyline points="330,225 450,225" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)"/>
<polyline points="750,225 870,225" fill="none" stroke="#526477" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#neutral)"/>
<text x="30" y="372" font-size="20" fill="#172b44" font-weight="700" text-anchor="start">Gradvis mer ansvar, faglig samarbeid og kunnskapsdeling gjennom hele reisen.</text>
</g></svg>
