<text x="1050" y="145" font-size="19" fill="#172b44" font-weight="700" text-anchor="middle">EHRbase</text>
<text x="1050" y="170" font-size="19" fill="#172b44" font-weight="700" text-anchor="middle">Klinisk repository</text>
<rect x="25" y="195" width="230" height="65" rx="3" fill="#e7f4e9" stroke="#87919c" stroke-width="1.2"/>
<text x="140" y="222" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Ber om oppdateringer</text>
<text x="140" y="247" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Pasient og tidspunkt</text>
<polyline points="140,295 440,295" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)" stroke-dasharray="6 5"/>
<text x="290.0" y="283" font-size="17" fill="#08776f" font-weight="400" text-anchor="middle">Forespørsel</text>
