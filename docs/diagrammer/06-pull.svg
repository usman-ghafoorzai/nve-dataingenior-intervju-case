<text x="450" y="145" font-size="19" fill="#172b44" font-weight="700" text-anchor="middle">Integrasjonsklient</text>
<text x="450" y="170" font-size="19" fill="#172b44" font-weight="700" text-anchor="middle">Validerer / mapper</text>
<rect x="620" y="110" width="260" height="840" rx="3" fill="#f3f7fb" stroke="#87919c" stroke-width="1.2"/>
<text x="750" y="145" font-size="19" fill="#172b44" font-weight="700" text-anchor="middle">Bridge / uthenting</text>
<text x="750" y="170" font-size="19" fill="#172b44" font-weight="700" text-anchor="middle">Oppslag / mapping</text>
