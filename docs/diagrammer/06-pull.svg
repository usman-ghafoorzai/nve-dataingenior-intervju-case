<text x="440" y="342" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Validerer forespørsel</text>
<text x="440" y="367" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Service / adapter</text>
<polyline points="440,415 740,415" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)" stroke-dasharray="6 5"/>
<text x="590.0" y="403" font-size="17" fill="#08776f" font-weight="400" text-anchor="middle">Uthentingsbehov</text>
