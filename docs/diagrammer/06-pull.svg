<text x="890.0" y="643" font-size="17" fill="#08776f" font-weight="400" text-anchor="middle">Resultat fra repository</text>
<rect x="625" y="675" width="230" height="65" rx="3" fill="#e7f4e9" stroke="#87919c" stroke-width="1.2"/>
<text x="740" y="702" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Parser resultatet</text>
<text x="740" y="727" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Mapper til FHIR</text>
<polyline points="740,775 440,775" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<text x="590.0" y="763" font-size="17" fill="#08776f" font-weight="400" text-anchor="middle">FHIR-basert respons</text>
<rect x="325" y="795" width="230" height="65" rx="3" fill="#e7f4e9" stroke="#87919c" stroke-width="1.2"/>
<text x="440" y="822" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Mapper til</text>
<text x="440" y="847" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">konsumentformat</text>
<polyline points="440,910 140,910" fill="none" stroke="#08776f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#pull)"/>
<text x="290.0" y="898" font-size="17" fill="#08776f" font-weight="400" text-anchor="middle">Data eller tom liste</text>
<rect x="20" y="985" width="1160" height="70" rx="3" fill="#f2f3f5" stroke="#87919c" stroke-width="1.2" stroke-dasharray="8 6"/>
<text x="40" y="1013" font-size="19" fill="#172b44" font-weight="700" text-anchor="start">VERIFIKASJON · riktig utvalg, tidsfilter, transformasjon og respons</text>
<text x="40" y="1040" font-size="17" fill="#526477" font-weight="400" text-anchor="start">Separate tester og API-/AQL-kontroller. Konsumenten styrer når den spør; ingen egen polling i klienten.</text>
</g></svg>
