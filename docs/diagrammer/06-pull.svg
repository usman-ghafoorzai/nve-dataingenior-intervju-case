<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2060" viewBox="0 0 1200 2060" role="img" aria-labelledby="title desc">
<title id="title">Pull – implementert flyt</title><desc id="desc">Origo dashboard sender patientId + lastUpdatedAt til PullController, PullService og FhirBridgeClient. MedicationPullController og MedicationPullService koordinerer EhrbaseHelper og EhrbaseMedicationQueryClient. AQL rows fra EHRbase parses av MedicationOrderAqlRowParser til MedicationOrderAqlRowDto og mappes av MedicationRequestMapper til FHIR MedicationRequest. FHIR Bundle returneres til MedicationPullMapper, som lager PullMedicationResponseDto med patientId, pulledAt og medications[] til Origo.</desc>
