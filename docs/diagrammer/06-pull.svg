<text x="1040" y="582" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Henter klinisk kontekst</text>
<text x="1040" y="607" font-size="17" fill="#172b44" font-weight="400" text-anchor="middle">Lagret openEHR</text>
